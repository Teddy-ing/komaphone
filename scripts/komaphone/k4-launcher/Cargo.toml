[package]
name = "komaphone-k4-launcher"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"

[workspace]

[dependencies]
sha2 = "=0.10.9"
serde_json = "=1.0.154"

[profile.dev]
debug = 0
incremental = false

[profile.release]
debug = 0
strip = true
opt-level = "s"
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"
